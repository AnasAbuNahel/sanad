services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sanad
      POSTGRES_PASSWORD: sanad
      POSTGRES_DB: sanad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanad"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sanad:sanad@db:5432/sanad
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
